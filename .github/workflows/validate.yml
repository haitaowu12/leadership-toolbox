name: Validate leadership package
on:
  pull_request:
  push:
    branches: [feat/standalone-leadership-skill, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-05
        with:
          python-version: '3.12'
      - name: Validate reviewed files and contracts
        run: python3 scripts/validate.py
      - name: Exercise package behavior
        run: python3 -m unittest discover -s tests -v
      - name: Build checked archive without publishing
        run: python3 scripts/build_release.py
